[project]
name = "noveland-backend"
version = "0.1.0"
description = "Backend workspace for Noveland."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18,<2",
  "noveland-adapters",
  "noveland-agents",
  "noveland-auth",
  "noveland-calendar",
  "noveland-conversations",
  "noveland-core",
  "noveland-events",
  "noveland-memory",
  "noveland-narrative",
  "noveland-observability",
  "noveland-plugins",
  "noveland-service-api",
  "noveland-service-runtime",
  "noveland-storage",
  "noveland-worlds",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "mypy>=1.20,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<0.16",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/adapters",
  "packages/agents",
  "packages/auth",
  "packages/calendar",
  "packages/conversations",
  "packages/core",
  "packages/events",
  "packages/memory",
  "packages/narrative",
  "packages/observability",
  "packages/plugins",
  "packages/storage",
  "packages/worlds",
  "services/api",
  "services/runtime",
]

[tool.uv.sources]
noveland-adapters = { workspace = true }
noveland-agents = { workspace = true }
noveland-auth = { workspace = true }
noveland-calendar = { workspace = true }
noveland-conversations = { workspace = true }
noveland-core = { workspace = true }
noveland-events = { workspace = true }
noveland-memory = { workspace = true }
noveland-narrative = { workspace = true }
noveland-observability = { workspace = true }
noveland-plugins = { workspace = true }
noveland-service-api = { workspace = true }
noveland-service-runtime = { workspace = true }
noveland-storage = { workspace = true }
noveland-worlds = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
files = ["packages", "services", "tests"]
exclude = ["migrations/versions/"]
mypy_path = [
  "packages/adapters/src",
  "packages/agents/src",
  "packages/auth/src",
  "packages/calendar/src",
  "packages/conversations/src",
  "packages/core/src",
  "packages/events/src",
  "packages/memory/src",
  "packages/narrative/src",
  "packages/observability/src",
  "packages/plugins/src",
  "packages/storage/src",
  "packages/worlds/src",
  "services/api/src",
  "services/runtime/src",
]
