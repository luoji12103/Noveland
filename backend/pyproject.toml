[project]
name = "noveland-backend"
version = "0.1.0"
description = "Backend workspace for Noveland."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18,<2",
  "noveland-adapters",
  "noveland-agents",
  "noveland-asset-generation",
  "noveland-authoring",
  "noveland-auth",
  "noveland-calendar",
  "noveland-conversations",
  "noveland-core",
  "noveland-events",
  "noveland-invocations",
  "noveland-memory",
  "noveland-media",
  "noveland-moderation",
  "noveland-narrative",
  "noveland-narrative-quality",
  "noveland-multimodal-eval",
  "noveland-observability",
  "noveland-package-contracts",
  "noveland-player-privacy",
  "noveland-plugins",
  "noveland-providers",
  "noveland-reader-delivery",
  "noveland-service-api",
  "noveland-service-runtime",
  "noveland-speech",
  "noveland-storage",
  "noveland-visual",
  "noveland-world-packaging",
  "noveland-worlds",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<0.1",
  "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "mypy>=1.20,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<0.16",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/adapters",
  "packages/agents",
  "packages/asset_generation",
  "packages/authoring",
  "packages/auth",
  "packages/calendar",
  "packages/conversations",
  "packages/core",
  "packages/events",
  "packages/invocations",
  "packages/memory",
  "packages/media",
  "packages/moderation",
  "packages/narrative",
  "packages/narrative_quality",
  "packages/multimodal_eval",
  "packages/observability",
  "packages/package_contracts",
  "packages/player_privacy",
  "packages/plugins",
  "packages/providers",
  "packages/reader_delivery",
  "packages/speech",
  "packages/storage",
  "packages/visual",
  "packages/world_packaging",
  "packages/worlds",
  "services/api",
  "services/runtime",
]

[tool.uv.sources]
noveland-adapters = { workspace = true }
noveland-agents = { workspace = true }
noveland-asset-generation = { workspace = true }
noveland-authoring = { workspace = true }
noveland-auth = { workspace = true }
noveland-calendar = { workspace = true }
noveland-conversations = { workspace = true }
noveland-core = { workspace = true }
noveland-events = { workspace = true }
noveland-invocations = { workspace = true }
noveland-memory = { workspace = true }
noveland-media = { workspace = true }
noveland-moderation = { workspace = true }
noveland-narrative = { workspace = true }
noveland-narrative-quality = { workspace = true }
noveland-multimodal-eval = { workspace = true }
noveland-observability = { workspace = true }
noveland-package-contracts = { workspace = true }
noveland-player-privacy = { workspace = true }
noveland-plugins = { workspace = true }
noveland-providers = { workspace = true }
noveland-reader-delivery = { workspace = true }
noveland-service-api = { workspace = true }
noveland-service-runtime = { workspace = true }
noveland-speech = { workspace = true }
noveland-storage = { workspace = true }
noveland-visual = { workspace = true }
noveland-world-packaging = { workspace = true }
noveland-worlds = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
files = ["packages", "services", "tests"]
exclude = ["migrations/versions/"]
mypy_path = [
  "packages/adapters/src",
  "packages/agents/src",
  "packages/asset_generation/src",
  "packages/authoring/src",
  "packages/auth/src",
  "packages/calendar/src",
  "packages/conversations/src",
  "packages/core/src",
  "packages/events/src",
  "packages/invocations/src",
  "packages/memory/src",
  "packages/media/src",
  "packages/moderation/src",
  "packages/narrative/src",
  "packages/narrative_quality/src",
  "packages/multimodal_eval/src",
  "packages/observability/src",
  "packages/package_contracts/src",
  "packages/player_privacy/src",
  "packages/plugins/src",
  "packages/providers/src",
  "packages/reader_delivery/src",
  "packages/speech/src",
  "packages/storage/src",
  "packages/visual/src",
  "packages/world_packaging/src",
  "packages/worlds/src",
  "services/api/src",
  "services/runtime/src",
]
