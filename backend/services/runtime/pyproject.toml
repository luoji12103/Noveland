[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noveland-service-runtime"
version = "0.1.0"
description = "Long-running runtime host for Noveland."
requires-python = ">=3.12,<3.13"
dependencies = [
  "noveland-adapters",
  "noveland-agents",
  "noveland-calendar",
  "noveland-conversations",
  "noveland-core",
  "noveland-events",
  "noveland-memory",
  "noveland-narrative",
  "noveland-observability",
  "noveland-plugins",
  "noveland-worlds",
  "nats-py>=2,<3",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
noveland-runtime = "noveland.services.runtime.main:main"

[tool.uv.sources]
noveland-adapters = { workspace = true }
noveland-agents = { workspace = true }
noveland-calendar = { workspace = true }
noveland-conversations = { workspace = true }
noveland-core = { workspace = true }
noveland-events = { workspace = true }
noveland-memory = { workspace = true }
noveland-narrative = { workspace = true }
noveland-observability = { workspace = true }
noveland-plugins = { workspace = true }
noveland-worlds = { workspace = true }
[tool.hatch.build.targets.wheel]
packages = ["src/noveland"]
