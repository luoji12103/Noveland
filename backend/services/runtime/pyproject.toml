[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noveland-service-runtime"
version = "0.1.0"
description = "Long-running runtime host for Noveland."
requires-python = ">=3.12,<3.13"
dependencies = [
  "noveland-core",
  "noveland-events",
  "noveland-worlds",
  "nats-py>=2,<3",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
noveland-runtime = "noveland.services.runtime.main:main"

[tool.uv.sources]
noveland-core = { workspace = true }
noveland-events = { workspace = true }
noveland-worlds = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/noveland"]
