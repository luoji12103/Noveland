[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noveland-service-api"
version = "0.1.0"
description = "HTTP and WebSocket entrypoint for Noveland."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.135,<0.136",
  "noveland-adapters",
  "noveland-agents",
  "noveland-auth",
  "noveland-calendar",
  "noveland-conversations",
  "noveland-core",
  "noveland-events",
  "noveland-memory",
  "noveland-narrative",
  "noveland-observability",
  "noveland-service-runtime",
  "noveland-worlds",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.38,<0.39",
]

[project.scripts]
noveland-api = "noveland.services.api.main:main"

[tool.uv.sources]
noveland-adapters = { workspace = true }
noveland-agents = { workspace = true }
noveland-auth = { workspace = true }
noveland-calendar = { workspace = true }
noveland-conversations = { workspace = true }
noveland-core = { workspace = true }
noveland-events = { workspace = true }
noveland-memory = { workspace = true }
noveland-narrative = { workspace = true }
noveland-observability = { workspace = true }
noveland-service-runtime = { workspace = true }
noveland-worlds = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/noveland"]
