[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noveland-package-contracts"
version = "0.1.0"
description = "Plugin and provider package contract validation for Noveland."
requires-python = ">=3.12,<3.13"
dependencies = [
  "noveland-plugins",
  "noveland-providers",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0,<3",
]

[tool.uv.sources]
noveland-plugins = { workspace = true }
noveland-providers = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/noveland"]
