[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noveland-storage"
version = "0.1.0"
description = "Object storage interfaces and implementations package for Noveland."
requires-python = ">=3.12,<3.13"
dependencies = [
  "noveland-core",
  "sqlalchemy>=2.0,<3",
]

[tool.uv.sources]
noveland-core = { workspace = true }

[project.scripts]
noveland-backup-verify = "noveland.storage.backup:main"

[tool.hatch.build.targets.wheel]
packages = ["src/noveland"]
