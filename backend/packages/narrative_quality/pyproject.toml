[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noveland-narrative-quality"
version = "0.1.0"
description = "API-first runtime narrative quality diagnostics and context contracts for Noveland."
requires-python = ">=3.12,<3.13"
dependencies = [
  "noveland-agents",
  "noveland-conversations",
  "noveland-core",
  "noveland-narrative",
  "noveland-providers",
  "noveland-worlds",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0,<3",
]

[tool.uv.sources]
noveland-agents = { workspace = true }
noveland-conversations = { workspace = true }
noveland-core = { workspace = true }
noveland-narrative = { workspace = true }
noveland-providers = { workspace = true }
noveland-worlds = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/noveland"]
