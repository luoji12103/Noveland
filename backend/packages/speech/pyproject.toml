[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noveland-speech"
version = "0.1.0"
description = "Speech provider and voice profile pipeline package for Noveland."
requires-python = ">=3.12,<3.13"
dependencies = [
  "noveland-agents",
  "noveland-conversations",
  "noveland-core",
  "noveland-invocations",
  "noveland-media",
  "noveland-providers",
  "noveland-worlds",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0,<3",
]

[tool.uv.sources]
noveland-agents = { workspace = true }
noveland-conversations = { workspace = true }
noveland-core = { workspace = true }
noveland-invocations = { workspace = true }
noveland-media = { workspace = true }
noveland-providers = { workspace = true }
noveland-worlds = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/noveland"]
