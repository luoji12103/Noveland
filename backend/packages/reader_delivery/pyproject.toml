[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noveland-reader-delivery"
version = "0.1.0"
description = "Reader-safe media delivery package for Noveland."
requires-python = ">=3.12,<3.13"
dependencies = [
  "noveland-conversations",
  "noveland-media",
  "noveland-narrative",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0,<3",
]

[tool.uv.sources]
noveland-conversations = { workspace = true }
noveland-media = { workspace = true }
noveland-narrative = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/noveland"]
