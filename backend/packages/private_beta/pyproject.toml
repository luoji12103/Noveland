[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noveland-private-beta"
version = "0.1.0"
description = "Private beta invite and onboarding workflow package for Noveland."
requires-python = ">=3.12,<3.13"
dependencies = [
  "noveland-auth",
  "noveland-core",
  "noveland-worlds",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0,<3",
]

[tool.uv.sources]
noveland-auth = { workspace = true }
noveland-core = { workspace = true }
noveland-worlds = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/noveland"]
