[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noveland-plugins"
version = "0.1.0"
description = "Plugin interfaces and registry package for Noveland."
requires-python = ">=3.12,<3.13"
dependencies = [
  "noveland-adapters",
  "noveland-agents",
  "noveland-calendar",
  "noveland-conversations",
  "noveland-memory",
  "pydantic>=2.13,<3",
]

[tool.uv.sources]
noveland-adapters = { workspace = true }
noveland-agents = { workspace = true }
noveland-calendar = { workspace = true }
noveland-conversations = { workspace = true }
noveland-memory = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/noveland"]
