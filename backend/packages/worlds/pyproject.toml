[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noveland-worlds"
version = "0.1.0"
description = "World model and orchestration package for Noveland."
requires-python = ">=3.12,<3.13"
dependencies = [
  "noveland-core",
  "sqlalchemy>=2.0,<3",
]

[tool.uv.sources]
noveland-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/noveland"]
