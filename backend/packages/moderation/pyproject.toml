[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noveland-moderation"
version = "0.1.0"
description = "Moderation reports, actions, and incident workflow for Noveland."
requires-python = ">=3.12,<3.13"
dependencies = [
  "noveland-core",
  "noveland-observability",
  "noveland-providers",
  "noveland-worlds",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0,<3",
]

[tool.uv.sources]
noveland-core = { workspace = true }
noveland-observability = { workspace = true }
noveland-providers = { workspace = true }
noveland-worlds = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/noveland"]
