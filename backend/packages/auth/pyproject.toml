[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noveland-auth"
version = "0.1.0"
description = "Auth boundaries and access model package for Noveland."
requires-python = ">=3.12,<3.13"
dependencies = [
  "noveland-core",
  "pydantic>=2.13,<3",
  "pwdlib[argon2]>=0.3,<1",
  "sqlalchemy>=2.0,<3",
]

[tool.uv.sources]
noveland-core = { workspace = true }

[project.scripts]
noveland-seed-admin = "noveland.auth.seed_admin:main"

[tool.hatch.build.targets.wheel]
packages = ["src/noveland"]
